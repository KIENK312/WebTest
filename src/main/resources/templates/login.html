<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Hệ Thống - Travel Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
            <i class="bi bi-compass-fill fs-3"></i>
            <span>BUSTICKET PRO</span>
        </a>
    </div>
</nav>

<div class="container py-5" style="max-width: 500px;">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
        <div class="text-center mb-4">
            <div class="badge bg-primary-subtle text-primary p-3 rounded-circle mb-3">
                <i class="bi bi-shield-lock-fill fs-2"></i>
            </div>
            <h4 class="fw-bold text-dark">Đăng Nhập Hệ Thống</h4>
            <p class="text-muted small">Phân quyền đa vai trò Spring Security (RBAC)</p>
        </div>

        <div id="loginAlert" class="alert alert-danger d-none rounded-3 py-2 small" role="alert"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label text-secondary fw-semibold">Tên đăng nhập (Username)</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" placeholder="Nhập username" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-secondary fw-semibold">Mật khẩu (Password)</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold shadow-sm mb-3" id="btnLogin">
                <i class="bi bi-box-arrow-in-right me-1"></i>Đăng Nhập
            </button>
        </form>

        <!-- Quick Demo Credentials Box -->
        <div class="bg-light p-3 rounded-3 small mt-3">
            <div class="fw-bold text-secondary mb-2"><i class="bi bi-info-circle me-1"></i>Tài khoản demo hệ thống:</div>
            <ul class="list-unstyled mb-0 text-muted" style="font-size: 0.85rem;">
                <li class="mb-1">• <strong>Admin:</strong> <code>admin</code> / <code>Admin@123</code></li>
                <li class="mb-1">• <strong>Nhà xe:</strong> <code>operator_futa</code> / <code>Operator@123</code></li>
                <li>• <strong>Khách hàng:</strong> <code>trungkien</code> / <code>Customer@123</code></li>
            </ul>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const alertBox = document.getElementById('loginAlert');
        const btn = document.getElementById('btnLogin');

        alertBox.classList.add('d-none');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Đang xác thực...';

        try {
            const res = await fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (res.ok && data.success) {
                // Lưu token
                localStorage.setItem('token', data.data.accessToken);
                localStorage.setItem('user', JSON.stringify(data.data));

                const role = data.data.role;
                if (role === 'ROLE_ADMIN') {
                    window.location.href = '/admin.html';
                } else if (role === 'ROLE_OPERATOR') {
                    window.location.href = '/operator.html';
                } else {
                    window.location.href = '/';
                }
            } else {
                alertBox.innerText = data.message || 'Tên đăng nhập hoặc mật khẩu không chính xác.';
                alertBox.classList.remove('d-none');
            }
        } catch (err) {
            alertBox.innerText = 'Lỗi kết nối máy chủ. Vui lòng thử lại sau.';
            alertBox.classList.remove('d-none');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i>Đăng Nhập';
        }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
