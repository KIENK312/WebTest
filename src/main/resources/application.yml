server:
  port: ${PORT:8080}
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: bus-ticket-multi-partner-service

  sql:
    init:
      mode: never

  # ---------------------------------------------------------------------------------------
  # CẤU HÌNH KẾT NỐI DATABASE (MS SQL SERVER & HIKARICP)
  # ---------------------------------------------------------------------------------------
  datasource:
    # URL kết nối SQL Server (Thay đổi host, port, databaseName theo môi trường thực tế)
    url: jdbc:sqlserver://localhost:1433;databaseName=QuanLyVeXeKhach2;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
    username: busweb
    password: 10101010aA@
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

    # Cấu hình Connection Pool HikariCP
    hikari:
      pool-name: BusTicketHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000
      auto-commit: true
      connection-test-query: SELECT 1

  # ---------------------------------------------------------------------------------------
  # CẤU HÌNH SPRING DATA JPA / HIBERNATE 6.x
  # ---------------------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        default_schema: dbo
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true

  # ---------------------------------------------------------------------------------------
  # CẤU HÌNH JACKSON (JSON SERIALIZATION / DESERIALIZATION)
  # ---------------------------------------------------------------------------------------
  jackson:
    date-format: "yyyy-MM-dd HH:mm:ss"
    time-zone: "Asia/Ho_Chi_Minh"
    locale: "vi_VN"
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

# -----------------------------------------------------------------------------------------
# CẤU HÌNH JWT (JSON WEB TOKEN)
# -----------------------------------------------------------------------------------------
jwt:
  # Secret key tối thiểu 256-bit (32 bytes) mã hóa Hex/Base64 cho thuật toán HMAC-SHA256
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000 # 24 giờ (1 ngày)

# -----------------------------------------------------------------------------------------
# CẤU HÌNH VIETQR & THANH TOÁN NGÂN HÀNG
# -----------------------------------------------------------------------------------------
vietqr:
  bank-id: "970422"                 # Mã BIN hoặc tên ngân hàng (970422: MBBank, 970436: VCB, etc.)
  bank-name: "MBBank"
  account-number: "090123456789"
  account-name: "HE THONG BAN VE XE KHACH"
  template: "compact2"

# -----------------------------------------------------------------------------------------
# CẤU HÌNH LOGGING
# -----------------------------------------------------------------------------------------
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.zaxxer.hikari: INFO
